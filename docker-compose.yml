# Single-host deployment: PostgreSQL + one-shot migrations + app + reverse proxy.
# Every secret is required — nothing falls back to a default:
#   cp .env.example .env   # then fill in the "Docker Compose" section
#   docker compose up --build
# See docs/operations.md for TLS, backups and secret rotation.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: casino
      # Consumed once by deploy/postgres/init/01-roles.sh on first start.
      CASINO_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
      CASINO_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    # No published port: only the migrate and app containers can reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d casino"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: tools
    environment: &app-env
      DATABASE_URL: postgresql://casino_migrator:${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}@db:5432/casino
      APP_URL: ${APP_URL:?set APP_URL in .env (https://your.domain in production)}
      SEED_ENCRYPTION_KEY: ${SEED_ENCRYPTION_KEY:?set SEED_ENCRYPTION_KEY in .env}
      SEED_ENCRYPTION_KEYS_PREVIOUS: ${SEED_ENCRYPTION_KEYS_PREVIOUS:-}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?set IP_HASH_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_HOPS: "1"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment:
      <<: *app-env
      # Least-privilege runtime role (owns nothing; see migration 0004).
      DATABASE_URL: postgresql://casino_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}@db:5432/casino
      BACKGROUND_JOBS: "true"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The only published port. Overwrites X-Forwarded-For so per-IP rate limits
  # cannot be spoofed (the app trusts exactly one hop: TRUST_PROXY_HOPS=1).
  # This proxy speaks plain HTTP: terminate TLS here (deploy/nginx-tls.conf)
  # or at a load balancer in front of it.
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_PORT:-3000}:8080"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
