# TLS-terminating variant of deploy/nginx.conf. Use it when this nginx is the
# public edge (no TLS load balancer in front):
#   * mount your certificate and key at /etc/nginx/tls/fullchain.pem and
#     /etc/nginx/tls/privkey.pem (e.g. from certbot / your CA);
#   * mount this file as /etc/nginx/nginx.conf and publish 80 and 443;
#   * set APP_URL=https://<your domain> for the app.
# TLS is only "enabled" once a real certificate for your domain is mounted —
# this repository ships none.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 64k;
  sendfile on;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  upstream app {
    server app:3000;
    keepalive 32;
  }

  # Plain HTTP: redirect everything (except ACME challenges) to HTTPS.
  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS belongs at the TLS terminator (2 years). Add "preload" only after
    # submitting the domain to the preload list.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 30s;
    }
  }
}
