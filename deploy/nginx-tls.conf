# TLS-terminating variant of deploy/nginx.conf. Use it when this nginx is the
# public edge (no TLS load balancer in front) — see docker-compose.tls.yml:
#   * mount your certificate and key at /etc/nginx/tls/fullchain.pem and
#     /etc/nginx/tls/privkey.pem (e.g. from certbot / your CA);
#   * publish 80 and 443; set APP_URL=https://<your domain> for the app.
# TLS is only "enabled" once a real certificate for your domain is mounted —
# this repository ships none.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  sendfile on;

  # Access log WITHOUT query strings: the password-reset page is opened with
  # ?token=…, and a full request line would write that single-use secret to
  # disk. $uri is the path only. No cookies, no Authorization header.
  log_format aurovane escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"upstream_ms":"$upstream_response_time","request_id":"$sent_http_x_request_id"}';
  access_log /dev/stdout aurovane;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Per-IP request rates: general traffic, and a much lower one for sign-in,
  # registration, codes and password recovery (the app enforces its own,
  # finer limits too).
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream app {
    server app:3000;
    keepalive 32;
  }

  # Plain HTTP: redirect everything (except ACME challenges) to HTTPS.
  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    limit_conn perip 50;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS belongs at the TLS terminator (2 years). Add "preload" only after
    # submitting the domain to the preload list.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Metrics are for the internal scraper (app:3000 on the private network), never
    # the public edge, even though the app also requires a bearer token.
    location ^~ /api/metrics {
      return 404;
    }

    location ~ ^/api/(auth|account/email|account/phone)/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }
  }
}
