# Reverse proxy in front of the app (TLS termination belongs here or at the
# load balancer in front of it). X-Forwarded-For is OVERWRITTEN with the TCP
# peer address so clients cannot spoof it; the app runs with TRUST_PROXY_HOPS=1.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  sendfile on;

  # Access log WITHOUT query strings: the password-reset page is opened with
  # ?token=…, and a full request line would write that single-use secret to
  # disk. $uri is the path only. No cookies, no Authorization header.
  log_format aurovane escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"upstream_ms":"$upstream_response_time","request_id":"$sent_http_x_request_id"}';
  access_log /dev/stdout aurovane;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Per-IP request rates: general traffic, and a much lower one for sign-in,
  # registration, codes and password recovery (the app enforces its own,
  # finer limits too).
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 8080;
    limit_conn perip 50;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Metrics are for the internal scraper (app:3000 on the private network), never
    # the public edge, even though the app also requires a bearer token.
    location ^~ /api/metrics {
      return 404;
    }

    location ~ ^/api/(auth|account/email|account/phone)/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof their address.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }
  }
}
