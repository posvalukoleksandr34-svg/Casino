# Reverse proxy in front of the app (TLS termination belongs here or at the
# load balancer in front of it). X-Forwarded-For is OVERWRITTEN with the TCP
# peer address so clients cannot spoof it; the app runs with TRUST_PROXY_HOPS=1.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 64k;
  sendfile on;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  upstream app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 8080;

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 30s;
    }
  }
}
