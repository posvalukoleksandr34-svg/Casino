# Slower verification that does not need to gate every pull request (docs/ci.md):
#   * 2,000,000-round Monte Carlo runs of every exactly-specified game scenario,
#     compared with RTPs derived independently from the published rules
#     (scripts/sim/independent-rtp.ts); a scenario fails beyond 4σ;
#   * a fresh blackjack run checked against the published estimate (4σ);
#   * the bankroll risk model with its self-consistency checks (--check).
# Every step fails the job on a failed check. The seed, commit, parameters and
# results of each run are written to reports/ (uploaded) and the job summary.
name: Extended verification

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC (default branch only, as for every scheduled workflow)
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds per exact-game scenario
        default: '2000000'
      seed:
        description: Seed (any string); empty = derived from the run id
        default: ''

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  simulations:
    name: Monte Carlo and risk model
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Inputs reach the scripts through the environment, never by template
      # expansion inside a shell command; the scripts validate them.
      ROUNDS: ${{ inputs.rounds || '2000000' }}
      SEED_INPUT: ${{ inputs.seed }}
      RUN_SEED: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Seed and commit
        run: |
          SEED="${SEED_INPUT:-$RUN_SEED}"
          echo "SEED=$SEED" >> "$GITHUB_ENV"
          { echo "## Extended verification"; echo "commit \`$GITHUB_SHA\` · seed \`$SEED\` · $ROUNDS rounds per scenario"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Exact games — Monte Carlo vs published rules
        run: |
          for g in roulette dice mines crash; do
            npm run sim:game -- "$g" --rounds "$ROUNDS" --seed "$SEED"
          done
      - name: Blackjack — independent run vs published estimate (default rules)
        run: npm run sim:game -- blackjack --rules 6-S17-3:2-DAS --hands 4000000 --check --seed "$SEED"
      - name: Bankroll / reserve risk model (self-consistency)
        run: npm run sim:risk -- --days 30 --paths 2000 --seed "$SEED" --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # Simulation reports only: parameters, seeds, aggregates. No user data exists here.
          name: simulation-reports
          path: reports/*.json
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 30
